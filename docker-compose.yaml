services:

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - luca_redis_data:/data
    networks:
      - luca-s3-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: username
      MINIO_ROOT_PASSWORD: password
    command: server /data --console-address ":9001"
    volumes:
      - luca_s3_data:/data
    networks:
      - luca-s3-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: luca-s3-worker
    volumes:
      - luca_s3_data:/data
      - /tmp/ffmpeg:/tmp/ffmpeg
    ports:
      - "50051:50051"
    env_file:
      - .default.env
    environment:
      REDIS_ADDR: redis:6379
      MINIO_ENDPOINT: minio:9000
    networks:
      - luca-s3-net
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

volumes:
  luca_redis_data:
  luca_s3_data:

networks:
  luca-s3-net:
    driver: bridge
