version: '3.9'

services:

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--requirepass", "password", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - backend-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "password", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  cassandra:
    image: cassandra:5.0
    container_name: cassandra
    ports:
      - "9042:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: media-cluster
      CASSANDRA_DC: dc1
      CASSANDRA_RACK: rack1
      CASSANDRA_AUTHENTICATOR: PasswordAuthenticator
      CASSANDRA_AUTHORIZER: CassandraAuthorizer
    volumes:
      - cassandra_data:/var/lib/cassandra
    networks:
      - backend-net
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -u cassandra -p cassandra -e 'describe keyspaces' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

  minio:
    image: minio/minio
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: username
      MINIO_ROOT_PASSWORD: password
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
      MINIO_BUCKET_NAME: luca-s3

    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - backend-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

nginx:
  image: nginx:alpine
  container_name: nginx
  ports:
    - "80:80"
  volumes:
    - ./nginx.conf:/etc/nginx/nginx.conf:ro
  depends_on:
    - app
    - minio
  networks:
    - backend-net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: luca-s3-app
    ports:
      - "8080:8080"
    env_file:
      - .default.env
    depends_on:
      cassandra:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/src
    working_dir: /src
    command: sh -c "go build -buildvcs=false -o /app/server ./cmd/server && /app/server"
    networks:
      - backend-net

volumes:
  minio_data:
  redis_data:
  cassandra_data:

networks:
  backend-net:
    driver: bridge
