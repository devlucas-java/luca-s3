syntax = "proto3";

package video;

option go_package = "github.com/devlucas-java/luca-s3/internal/delivery/grpc/pb";

// ─── Enums ───────────────────────────────────────────────────────────────────

enum Resolution {
  RESOLUTION_UNKNOWN = 0;
  RESOLUTION_360P    = 1;
  RESOLUTION_480P    = 2;
  RESOLUTION_720P    = 3;
  RESOLUTION_1080P   = 4;
  RESOLUTION_1440P   = 5;
  RESOLUTION_4K      = 6;
}

enum JobStatus {
  JOB_STATUS_UNKNOWN    = 0;
  JOB_STATUS_PENDING    = 1;
  JOB_STATUS_PROCESSING = 2;
  JOB_STATUS_DONE       = 3;
  JOB_STATUS_FAILED     = 4;
}

// ─── Transcode ────────────────────────────────────────────────────────────────

message TranscodeVideoRequest {
  string              video_id      = 1; // Video ID in MinIO
  string              original_path = 2; // Path in MinIO: videos/{id}.mp4
  repeated Resolution resolutions   = 3; // Desired resolutions
}

message TranscodeVideoResponse {
  string job_id   = 1;
  string video_id = 2;
}

// ─── Job Status ───────────────────────────────────────────────────────────────

message JobStatusRequest {
  string job_id = 1;
}

message ResolutionProgress {
  Resolution resolution      = 1;
  JobStatus  status          = 2;
  int32      last_segment    = 3; // Last processed segment
  int32      total_segments  = 4; // Total expected segments
  bool       thumbnail_done  = 5; // Whether thumbnail was generated
  string     error           = 6;
}

message JobStatusResponse {
  string                      job_id           = 1;
  string                      video_id         = 2;
  JobStatus                   status           = 3;
  repeated ResolutionProgress progress         = 4;
  int32                       original_width   = 5;
  int32                       original_height  = 6;
  double                      duration_seconds = 7;
}

// ─── HLS Manifest ─────────────────────────────────────────────────────────────

message GetHLSManifestRequest {
  string video_id   = 1;
  int32  expires_in = 2; // seconds, default 3600
}

message GetHLSManifestResponse {
  string url        = 1;
  int32  expires_in = 2;
}

// ─── Delete Video ─────────────────────────────────────────────────────────────

message DeleteVideoRequest {
  string video_id = 1;
}

message DeleteVideoResponse {
  bool   success = 1;
  string message = 2;
}

// ─── Service ──────────────────────────────────────────────────────────────────

service VideoService {
  // Start HLS transcoding for a video in MinIO
  rpc TranscodeVideo(TranscodeVideoRequest) returns (TranscodeVideoResponse);

  // Query job status
  rpc GetJobStatus(JobStatusRequest) returns (JobStatusResponse);

  // Get HLS master playlist URL
  rpc GetHLSManifest(GetHLSManifestRequest) returns (GetHLSManifestResponse);

  // Delete video and all related files from MinIO
  rpc DeleteVideo(DeleteVideoRequest) returns (DeleteVideoResponse);
}
